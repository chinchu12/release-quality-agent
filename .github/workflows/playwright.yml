name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://www.saucedemo.com/
      BUILD_NUMBER: ${{ github.run_number }}
      BRANCH_NAME: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
      RELEASE_VERSION: v1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Generate release summary
        if: always()
        run: npx tsx scripts/parseResults.ts

      - name: Send release summary to n8n
        if: always()
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @test-results/release-summary.json \
            "${{ secrets.N8N_WEBHOOK_URL }}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload release summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: test-results/release-summary.json
          retention-days: 30